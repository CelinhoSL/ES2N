o trabalho em equipe]\\n      (Sprints)\\n        [Ciclos fixos de trabalho, geralmente de duas a quatro semanas, com escopo definido]\\n      (Papéis Definidos)\\n        [Product Owner prioriza o backlog, Scrum Master remove impedimentos, Time entrega o incremento]\\n      (Cerimônias)\\n        [Planning, Daily Scrum, Review e Retrospectiva estruturam a comunicação da equipe]\\n      (Artefatos)\\n        [Product Backlog, Sprint Backlog e Incremento tornam o progresso visível e mensurável]\\n      (Empirismo)\\n        [Decisões baseadas em transparência, inspeção e adaptação constante do processo]\\n    (Rational Unified Process - RUP)\\n      [Processo iterativo e mais formal, orientado por documentação e controle de qualidade]\\n      (Fases Sequenciais)\\n        [Concepção, Elaboração, Construção e Transição estruturam o ciclo de vida do projeto]\\n      (Disciplinas)\\n        [Modelagem de negócio, requisitos, análise, implementação e testes são tratados como áreas distintas]\\n      (Artefatos Formais)\\n        [Diagramas UML, documentos de arquitetura e casos de uso guiam o desenvolvimento]\\n      (Gestão de Riscos)\\n        [Riscos são identificados e mitigados logo nas fases iniciais do projeto]\\n      (Adaptável mas Pesado)\\n        [Pode ser customizado, porém tende a gerar mais burocracia que os métodos ágeis]&amp;quot;,&amp;#xa;  &amp;quot;config&amp;quot;: null&amp;#xa;}\&quot; id=\&quot;N3iLNy8XJHVUhs9Wpmih-113\&quot;&gt;\n          &lt;mxCell connectable=\&quot;0\&quot; parent=\&quot;1\&quot; style=\&quot;group;transparentBounds=1;editIcon=1;lockedGroup=0;groupPadding=10;\&quot; vertex=\&quot;1\&quot;&gt;\n            &lt;mxGeometry as=\&quot;geometry\&quot; /&gt;\n          &lt;/mxCell&gt;\n        &lt;/UserObject&gt;\n        &lt;UserObject label=\&quot;\&quot; mermaidId=\&quot;e:mm0-&amp;gt;mm1#0\&quot; mermaidBaseStyle=\&quot;curved=1;startArrow=none;endArrow=none;strokeWidth=11;strokeColor=light-dark(#FFFF78,#cccccc);linecap=square;\&
